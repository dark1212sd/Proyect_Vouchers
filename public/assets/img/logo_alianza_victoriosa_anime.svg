<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Degradado Neón Cyber-Anime -->
        <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="50%" stop-color="#0072ff" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>

        <!-- Degradado para la Hoja Central "V" (Oro/Esmeralda) -->
        <linearGradient id="bladeGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#a8ff78" />
        </linearGradient>

        <!-- Filtros de Resplandor Neón Intenso -->
        <filter id="mechaGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <filter id="glintGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur1" />
            <feGaussianBlur stdDeviation="12" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <style>
        /* ANIMACIONES ESTILO ANIME / MECHA */
        .mecha-hover {
            animation: mechaFloat 4s ease-in-out infinite;
            transform-origin: center;
        }
        
        /* El clásico destello de espada/lentes de anime */
        .anime-glint {
            transform-origin: 256px 260px;
            animation: glintFlash 4s cubic-bezier(0.1, 0.9, 0.2, 1) infinite;
        }
        
        /* Líneas de energía del núcleo */
        .energy-pulse {
            transform-origin: 256px 260px;
            animation: corePulse 2s linear infinite;
        }

        /* Partículas flotantes de aura digital */
        .particle-1 { animation: dataRise 3s ease-in infinite; transform-origin: 180px 400px; }
        .particle-2 { animation: dataRise 2.5s ease-in 0.8s infinite; transform-origin: 330px 420px; }
        .particle-3 { animation: dataRise 3.5s ease-in 1.5s infinite; transform-origin: 256px 440px; }
        
        @keyframes mechaFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); filter: drop-shadow(0 15px 25px rgba(0, 242, 254, 0.4)); }
        }
        
        @keyframes glintFlash {
            0%, 75%, 100% { transform: scale(0) rotate(-45deg); opacity: 0; }
            80% { transform: scale(1.6) rotate(0deg); opacity: 1; }
            85% { transform: scale(0.8) rotate(45deg); opacity: 0.8; }
            90% { transform: scale(1.8) rotate(90deg); opacity: 1; }
            95% { transform: scale(0) rotate(135deg); opacity: 0; }
        }
        
        @keyframes corePulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; stroke-width: 4px; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        @keyframes dataRise {
            0% { transform: translateY(0px) scale(0); opacity: 0; }
            50% { opacity: 1; transform: translateY(-80px) scale(1.2); }
            100% { transform: translateY(-180px) scale(0); opacity: 0; }
        }
    </style>

    <!-- FONDO: ESCUDO HEXAGONAL MECHA (Estilo Cyberpunk) -->
    <polygon points="256,20 460,110 460,380 256,490 52,380 52,110" 
             fill="#0a0f24" 
             stroke="url(#cyberGradient)" 
             stroke-width="8" 
             stroke-linejoin="round" />
             
    <!-- Marco interno táctico -->
    <polygon points="256,45 435,125 435,365 256,465 77,365 77,125" 
             fill="none" 
             stroke="#00f2fe" 
             stroke-width="2" 
             stroke-opacity="0.3" 
             stroke-dasharray="10 6" />

    <!-- GRUPO PRINCIPAL: MONOGRAMA MECHA FLOTANTE -->
    <g class="mecha-hover" filter="url(#mechaGlow)">
        
        <!-- ALAS EXTERNAS (La "A" de Alianza con alas cortantes) -->
        <path d="M 256,80 L 110,380 L 170,380 L 256,200 L 342,380 L 402,380 Z" 
              fill="url(#cyberGradient)" />
              
        <!-- BARRA HORIZONTAL DE LA "A" (Rayo de energía pasante) -->
        <polygon points="140,290 372,290 355,325 157,325" 
                 fill="#00f2fe" 
                 opacity="0.9" />

        <!-- NÚCLEO / HOJA CENTRAL (La "V" de Victoriosa como una espada o Checkmark) -->
        <polygon points="190,240 256,380 322,240 285,240 256,310 227,240" 
                 fill="url(#bladeGradient)" 
                 filter="url(#mechaGlow)" />
                 
        <!-- Anillo de energía central (Radar de objetivo) -->
        <circle cx="256" cy="260" r="45" 
                fill="none" 
                stroke="#00f2fe" 
                stroke-width="2" 
                stroke-dasharray="15 10" 
                class="energy-pulse" />
    </g>

    <!-- PARTÍCULAS DE AURA DIGITAL (Efecto de poder ascendente) -->
    <rect x="180" y="400" width="8" height="8" rx="2" fill="#00f2fe" class="particle-1" filter="url(#glintGlow)" />
    <polygon points="330,420 335,410 340,420 335,430" fill="#10b981" class="particle-2" filter="url(#glintGlow)" />
    <circle cx="256" cy="440" r="5" fill="#ffffff" class="particle-3" filter="url(#glintGlow)" />

    <!-- DESTELLO ANIME FINAL (Estrella blanca de 4 puntas sobre el núcleo) -->
    <g class="anime-glint" filter="url(#glintGlow)">
        <!-- Rayo vertical y horizontal -->
        <path d="M 256,160 L 263,253 L 356,260 L 263,267 L 256,360 L 249,267 L 156,260 L 249,253 Z" fill="#ffffff" />
        <!-- Núcleo de la estrella -->
        <circle cx="256" cy="260" r="12" fill="#a8ff78" />
    </g>
</svg>
